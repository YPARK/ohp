[package]
name = "ohp"
version = "0.1.11"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Yongjin Park <yongjin.park@ubc.ca>"]
description = "Present beamer PDF slides, markdown and HTML in the terminal over the kitty graphics protocol"
repository = "https://github.com/YPARK/ohp"
keywords = ["pdf", "beamer", "slides", "tui", "markdown"]
categories = ["command-line-utilities", "visualization"]

[features]
default = ["markdown", "speech", "summary"]
# Pages summed up, and their key sentences lit, by a language model run in
# ohp with candle, on Metal on macOS; the sentences a file is summed up
# from picked with a small embedding model. Both are downloaded once from
# Hugging Face's Hub, with curl, into its own cache. candle's tokenizers
# read regular expressions with Oniguruma, whose C the system toolchain
# builds.
summary = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:libc",
    "dep:serde_json",
    "dep:signal-hook",
    "dep:tokenizers",
]
# Slides read aloud by a speech program, run as R is, in a session of its own.
speech = ["dep:libc", "dep:signal-hook", "dep:serde_json"]
# Markdown, R Markdown and HTML, typeset by typst. Typst's evaluator grows
# its stack through `psm`, which assembles one small file with the C
# toolchain. Citations are read with typst's own bibliography crates.
# Images, and several files shown together, are set by typst too; ohp
# measures images, and makes large ones smaller, with the codecs typst
# reads them with.
markdown = [
    "dep:base64",
    "dep:hayagriva",
    "image/png",
    "image/jpeg",
    "image/gif",
    "image/webp",
    "dep:libc",
    "dep:percent-encoding",
    "dep:pulldown-cmark",
    "dep:scraper",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:signal-hook",
    "dep:typst",
    "dep:typst-assets",
    "dep:typst-layout",
    "dep:typst-pdf",
]

[dependencies]
anyhow = "1.0"
base64 = { version = "0.22", optional = true }
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
clap = { version = "4.6", features = ["derive", "env"] }
hayagriva = { version = "0.10.1", optional = true }
hayro = "0.7.1"
image = { version = "0.25", default-features = false }
percent-encoding = { version = "2.3", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
ratatui = "0.30"
# Without default features: `chafa-dyn` links a C library.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
scraper = { version = "0.23", optional = true, default-features = false }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
tempfile = "3.27.0"
tokenizers = { version = "0.22.2", default-features = false, optional = true }
typst = { version = "0.15.1", optional = true }
typst-assets = { version = "0.15.1", features = ["fonts"], optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-pdf = { version = "0.15.1", optional = true }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
# To stop knitr's chunks with R, and a speech pipeline, as their process group.
libc = { version = "0.2", optional = true }
# To stop them on Ctrl-C, which no longer reaches their process group.
signal-hook = { version = "0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The language model runs on the GPU, through Metal.
candle-core = { version = "0.10.2", features = ["metal"], optional = true }
candle-transformers = { version = "0.10.2", features = ["metal"], optional = true }
